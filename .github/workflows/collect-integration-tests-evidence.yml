name: Collect Integration Tests Evidence

on:
  workflow_run:
    workflows:
      - Integration Tests
    types:
      - completed

permissions:
  actions: read
  checks: read

jobs:
  collect-check-run:
    name: Collect Check Run Metadata

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (
        github.event.workflow_run.head_branch == 'main-demo' ||
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Collect Integration Tests Evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowRun = context.payload.workflow_run;

            const runId = workflowRun.id;
            const runAttempt = workflowRun.run_attempt;
            const expectedSha = workflowRun.head_sha;
            const branch = workflowRun.head_branch;

            const validationStage =
              branch === 'main-demo'
                ? 'feature_to_main_demo'
                : 'main_demo_to_main';

            const baseRef = branch;

            // Получаем полную информацию об исходном Workflow Run.
            const { data: runDetails } =
              await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: runId
              });

            // GitHub API path имеет формат:
            // .github/workflows/integration-tests.yml@main
            // Преобразуем его в формат github.workflow_ref.
            const workflowPath = runDetails.path.split('@')[0];

            const workflowRef =
              `${owner}/${repo}/${workflowPath}@refs/heads/${branch}`;

            // Получаем jobs конкретной попытки.
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {
                owner,
                repo,
                run_id: runId,
                attempt_number: runAttempt,
                per_page: 100
              }
            );

            const matchingJobs = jobs.filter(
              job => job.name === 'integration-tests'
            );

            if (matchingJobs.length !== 1) {
              throw new Error(
                `Expected exactly one integration-tests job, found ${matchingJobs.length}`
              );
            }

            const job = matchingJobs[0];

            if (!job.check_run_url) {
              throw new Error('Missing check_run_url');
            }

            const match = job.check_run_url.match(
              /\/check-runs\/(\d+)$/
            );

            if (!match) {
              throw new Error(
                `Cannot extract Check Run ID from ${job.check_run_url}`
              );
            }

            const checkRunId = Number(match[1]);

            // Получаем полные Check Run metadata.
            const { data: checkRun } = await github.rest.checks.get({
              owner,
              repo,
              check_run_id: checkRunId
            });

            // Проверяем соответствие SHA и результат проверки.
            if (checkRun.head_sha !== expectedSha) {
              throw new Error(
                'Check Run SHA does not match workflow SHA'
              );
            }

            if (checkRun.name !== 'integration-tests') {
              throw new Error(
                `Unexpected Check Run name: ${checkRun.name}`
              );
            }

            if (
              checkRun.status !== 'completed' ||
              checkRun.conclusion !== 'success'
            ) {
              throw new Error(
                'Integration Tests Check Run did not succeed'
              );
            }

            // Workflow Run — поля соответствуют Manifest.
            const workflowRunEvidence = {
              run_id: runId,
              run_attempt: runAttempt,
              workflow_name: workflowRun.name,
              validation_stage: validationStage,
              base_ref: baseRef,
              workflow_ref: workflowRef,
              workflow_sha: workflowRun.head_sha,
              event_name: workflowRun.event,
              actor: workflowRun.actor.login,
              run_url: workflowRun.html_url
            };

            // Check Run — поля соответствуют Manifest.
            const checkResult = {
              name: 'Integration Tests',
              validation_stage: validationStage,
              base_ref: baseRef,
              check_run_id: checkRun.id,
              check_suite_id: checkRun.check_suite.id,
              head_sha: checkRun.head_sha,
              status: checkRun.status,
              conclusion: checkRun.conclusion,
              started_at: checkRun.started_at,
              completed_at: checkRun.completed_at,
              app_id: checkRun.app ? checkRun.app.id : null,
              url: checkRun.html_url
            };

            // Формируем Evidence JSON.
            const evidence = {
              validation_evidence: {
                workflow_runs: [
                  workflowRunEvidence
                ],
                check_results: [
                  checkResult
                ]
              }
            };

            // Сохраняем JSON.
            fs.mkdirSync('workflow-data', { recursive: true });

            fs.writeFileSync(
              'workflow-data/integration-tests-collected-evidence.json',
              JSON.stringify(evidence, null, 2) + '\n'
            );

            // Выводим результат в GitHub Actions Summary.
            await core.summary
              .addHeading('Integration Tests Evidence')
              .addCodeBlock(JSON.stringify(evidence, null, 2), 'json')
              .write();

            core.info(
              'Integration Tests evidence created successfully.'
            );

      - name: Upload Integration Tests Evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-collected-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: workflow-data/integration-tests-collected-evidence.json
          retention-days: 7
          if-no-files-found: error
