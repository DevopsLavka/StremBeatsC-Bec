name: Enqueue Merge Queue

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main-demo
      - main

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: enqueue-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  enqueue:
    name: Enqueue PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        (
          startsWith(github.event.pull_request.head.ref, 'feature/') &&
          github.event.pull_request.base.ref == 'main-demo'
        ) ||
        (
          github.event.pull_request.head.ref == 'main-demo' &&
          github.event.pull_request.base.ref == 'main'
        )
      )

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.CI_CD_BOT_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Validate pull request
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          PR_JSON=$(gh api graphql \
            -F owner="$GITHUB_REPOSITORY_OWNER" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    id
                    url
                    headRefOid
                    headRefName
                    baseRefName
                    isDraft
                    isInMergeQueue
                  }
                }
              }
            ')

          PR=$(jq -c '.data.repository.pullRequest' <<< "$PR_JSON")

          if [[ "$PR" == "null" ]]; then
            echo "::error::Pull request #$PR_NUMBER not found."
            exit 1
          fi

          HEAD_REF=$(jq -r '.headRefName' <<< "$PR")
          BASE_REF=$(jq -r '.baseRefName' <<< "$PR")
          IS_DRAFT=$(jq -r '.isDraft' <<< "$PR")
          IS_QUEUED=$(jq -r '.isInMergeQueue' <<< "$PR")
          HEAD_OID=$(jq -r '.headRefOid' <<< "$PR")
          PR_ID=$(jq -r '.id' <<< "$PR")
          PR_URL=$(jq -r '.url' <<< "$PR")

          if [[ "$HEAD_REF" == feature/* && "$BASE_REF" == "main-demo" ]]; then
            echo "Valid promotion path: feature -> main-demo"

          elif [[ "$HEAD_REF" == "main-demo" && "$BASE_REF" == "main" ]]; then
            echo "Valid promotion path: main-demo -> main"

          else
            echo "::error::Unexpected PR branches: $HEAD_REF -> $BASE_REF"
            exit 1
          fi

          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "PR is a draft. Skipping."
            exit 0
          fi

          if [[ -n "$EVENT_HEAD_SHA" && "$HEAD_OID" != "$EVENT_HEAD_SHA" ]]; then
            echo "This run refers to an outdated commit. Skipping."
            exit 0
          fi

          if [[ "$IS_QUEUED" == "true" ]]; then
            echo "PR is already in the merge queue."
            exit 0
          fi

          {
            echo "pr_id=$PR_ID"
            echo "head_oid=$HEAD_OID"
            echo "head_ref=$HEAD_REF"
            echo "base_ref=$BASE_REF"
            echo "pr_url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Enqueue pull request
        id: enqueue
        if: steps.validate.outputs.pr_id != ''
        shell: bash
        env:
          PR_ID: ${{ steps.validate.outputs.pr_id }}
          HEAD_OID: ${{ steps.validate.outputs.head_oid }}
        run: |
          set -euo pipefail

          ENQUEUE_JSON=$(gh api graphql \
            -f query='
              mutation($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
                enqueuePullRequest(input: {
                  pullRequestId: $pullRequestId,
                  expectedHeadOid: $expectedHeadOid
                }) {
                  mergeQueueEntry {
                    id
                  }
                }
              }
            ' \
            -F pullRequestId="$PR_ID" \
            -F expectedHeadOid="$HEAD_OID")

          QUEUE_ENTRY_ID=$(jq -r \
            '.data.enqueuePullRequest.mergeQueueEntry.id // empty' \
            <<< "$ENQUEUE_JSON")

          if [[ -z "$QUEUE_ENTRY_ID" ]]; then
            echo "::error::GitHub did not return a Merge Queue Entry ID."
            jq . <<< "$ENQUEUE_JSON"
            exit 1
          fi

          echo "queue_entry_id=$QUEUE_ENTRY_ID" >> "$GITHUB_OUTPUT"

      - name: Create enqueue event record
        if: steps.enqueue.outputs.queue_entry_id != ''
        shell: bash
        env:
          PR_ID: ${{ steps.validate.outputs.pr_id }}
          PR_URL: ${{ steps.validate.outputs.pr_url }}
          HEAD_OID: ${{ steps.validate.outputs.head_oid }}
          HEAD_REF: ${{ steps.validate.outputs.head_ref }}
          BASE_REF: ${{ steps.validate.outputs.base_ref }}
          QUEUE_ENTRY_ID: ${{ steps.enqueue.outputs.queue_entry_id }}
        run: |
          set -euo pipefail

          mkdir -p workflow-data

          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg record_id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_id "$PR_ID" \
            --arg pr_url "$PR_URL" \
            --arg head_ref "$HEAD_REF" \
            --arg base_ref "$BASE_REF" \
            --arg head_sha "$HEAD_OID" \
            --arg queue_entry_id "$QUEUE_ENTRY_ID" \
            --arg created_at "$CREATED_AT" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg event_action "${{ github.event.action || 'workflow_dispatch' }}" \
            --arg actor "$GITHUB_ACTOR" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              record_id: $record_id,
              record_type: "pull_request_enqueue",
              created_at: $created_at,
              repository: $repository,
              pull_request: {
                number: ($pr_number | tonumber),
                id: $pr_id,
                url: $pr_url,
                head_ref: $head_ref,
                base_ref: $base_ref,
                head_sha: $head_sha
              },
              merge_queue: {
                entry_id: $queue_entry_id,
                status: "enqueued"
              },
              workflow_run: {
                run_id: ($run_id | tonumber),
                run_attempt: ($run_attempt | tonumber),
                workflow_name: $workflow_name,
                workflow_ref: $workflow_ref,
                workflow_sha: $workflow_sha,
                event_name: $event_name,
                event_action: $event_action,
                actor: $actor,
                run_url: $run_url
              }
            }' > workflow-data/enqueue-event.json

          jq . workflow-data/enqueue-event.json

      - name: Upload enqueue event artifact
        if: steps.enqueue.outputs.queue_entry_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: enqueue-pr-${{ env.PR_NUMBER }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: workflow-data/enqueue-event.json
          if-no-files-found: error
          retention-days: 7

