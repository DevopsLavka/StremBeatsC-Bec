name: Enqueue Merge Queue

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: enqueue-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  enqueue:
    name: Enqueue PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.ref == 'main-demo' &&
        github.event.pull_request.base.ref == 'main'
      )
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Validate pull request
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          PR_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json id,headRefOid,headRefName,baseRefName,isDraft,isInMergeQueue)

          echo "$PR_JSON"

          HEAD_REF=$(jq -r '.headRefName' <<< "$PR_JSON")
          BASE_REF=$(jq -r '.baseRefName' <<< "$PR_JSON")
          IS_DRAFT=$(jq -r '.isDraft' <<< "$PR_JSON")
          IS_QUEUED=$(jq -r '.isInMergeQueue' <<< "$PR_JSON")
          HEAD_OID=$(jq -r '.headRefOid' <<< "$PR_JSON")
          PR_ID=$(jq -r '.id' <<< "$PR_JSON")

          if [[ "$HEAD_REF" != "main-demo" || "$BASE_REF" != "main" ]]; then
            echo "::error::Unexpected PR branches: $HEAD_REF -> $BASE_REF"
            exit 1
          fi

          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "PR is a draft. Skipping."
            exit 1
          fi

          if [[ -n "$EVENT_HEAD_SHA" && "$HEAD_OID" != "$EVENT_HEAD_SHA" ]]; then
            echo "This run refers to an outdated commit. A newer run will handle the PR."
            exit 0
          fi

          if [[ "$IS_QUEUED" == "true" ]]; then
            echo "PR is already in the merge queue."
            exit 0
          fi

          echo "pr_id=$PR_ID" >> "$GITHUB_OUTPUT"
          echo "head_oid=$HEAD_OID" >> "$GITHUB_OUTPUT"

      - name: Wait for required PR checks
        if: steps.validate.outputs.pr_id != ''
        run: |
          gh pr checks "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --required \
            --watch \
            --fail-fast

      - name: Enqueue pull request
        if: steps.validate.outputs.pr_id != ''
        shell: bash
        env:
          PR_ID: ${{ steps.validate.outputs.pr_id }}
          HEAD_OID: ${{ steps.validate.outputs.head_oid }}
        run: |
          set -euo pipefail

          gh api graphql \
            -f query='
              mutation($pullRequestId: ID!, $expectedHeadOid: GitObjectID!) {
                enqueuePullRequest(input: {
                  pullRequestId: $pullRequestId,
                  expectedHeadOid: $expectedHeadOid
                }) {
                  mergeQueueEntry {
                    id
                  }
                }
              }
            ' \
            -F pullRequestId="$PR_ID" \
            -F expectedHeadOid="$HEAD_OID"
