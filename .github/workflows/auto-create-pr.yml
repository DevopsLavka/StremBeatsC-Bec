name: Auto Create Pull Request

on:
  workflow_run:
    workflows:
      - Integration Tests
    types:
      - completed
    branches:
      - main-demo

permissions:
  contents: read
  pull-requests: read

jobs:
  create-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify latest commit and compare branches
        id: verify
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          MAIN_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" \
            --jq '.commit.sha')

          MAIN_DEMO_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main-demo" \
            --jq '.commit.sha')

          if [ "$MAIN_DEMO_SHA" != "$HEAD_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists. Skipping stale workflow run."
            exit 0
          fi

          MAIN_TREE=$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" \
            --jq '.commit.commit.tree.sha')

          MAIN_DEMO_TREE=$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main-demo" \
            --jq '.commit.commit.tree.sha')

          if [ "$MAIN_TREE" = "$MAIN_DEMO_TREE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main and main-demo contain identical files. No PR needed."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Branches contain different files. PR can be created."
          fi

      - name: Create pull request if needed
        if: steps.verify.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head main-demo \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head main-demo \
              --title "Merge main-demo into main" \
              --body "Automatically created after successful Integration Tests."
          else
            echo "Pull request #$PR_NUMBER already exists."
          fi
