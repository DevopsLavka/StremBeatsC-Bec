name: Sync main-demo after merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-demo
  cancel-in-progress: false

jobs:
  sync:
    name: Align main-demo with main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main-demo
        uses: actions/checkout@v4
        with:
          ref: main-demo
          token: ${{ secrets.PULL_REQUEST_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and verify branches
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main main-demo

          MAIN_SHA=$(git rev-parse origin/main)
          DEMO_SHA=$(git rev-parse origin/main-demo)
          MAIN_TREE=$(git rev-parse "${MAIN_SHA}^{tree}")
          DEMO_TREE=$(git rev-parse "${DEMO_SHA}^{tree}")

          echo "main SHA:      $MAIN_SHA"
          echo "main-demo SHA: $DEMO_SHA"
          echo "main tree:     $MAIN_TREE"
          echo "demo tree:     $DEMO_TREE"

          if [[ "$MAIN_SHA" == "$DEMO_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ Branches already point to the same commit. Nothing to do."
            exit 0
          fi

          if [[ "$MAIN_TREE" != "$DEMO_TREE" ]]; then
            echo "::error::❌ Branch contents differ. Refusing to overwrite main-demo."
            echo "::error::main and main-demo have diverged. Manual intervention required."
            echo "::error::No backup or branch update was performed."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "demo_sha=$DEMO_SHA" >> "$GITHUB_OUTPUT"
          echo "ℹ️ Branches have the same content but different SHAs. Will align main-demo → main."

      - name: Backup current main-demo
        if: steps.verify.outputs.skip == 'false'
        shell: bash
        env:
          DEMO_SHA: ${{ steps.verify.outputs.demo_sha }}
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup/main-demo-before-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "${DEMO_SHA}:refs/heads/${BACKUP_BRANCH}"

          echo "✅ Created backup branch: $BACKUP_BRANCH"
          echo "backup_branch=$BACKUP_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Align main-demo with main
        if: steps.verify.outputs.skip == 'false'
        shell: bash
        env:
          MAIN_SHA: ${{ steps.verify.outputs.main_sha }}
          DEMO_SHA: ${{ steps.verify.outputs.demo_sha }}
        run: |
          set -euo pipefail

          git push \
            --force-with-lease="refs/heads/main-demo:${DEMO_SHA}" \
            origin \
            "${MAIN_SHA}:refs/heads/main-demo"

          echo "✅ main-demo successfully aligned to $MAIN_SHA"
