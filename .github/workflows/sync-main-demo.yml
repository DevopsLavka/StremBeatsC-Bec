
name: Sync main-demo after merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main-demo
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into main-demo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: DevopsLavka
          repositories: StremBeatsC-Bec

      - name: Checkout main-demo
        uses: actions/checkout@v4
        with:
          ref: main-demo
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize branches with retries
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=5
          BACKUP_CREATED=false

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "========================================"
            echo "Synchronization attempt: $ATTEMPT/$MAX_ATTEMPTS"
            echo "========================================"

            # Always fetch the latest state of both branches.
            git fetch origin main main-demo

            MAIN_SHA=$(git rev-parse origin/main)
            DEMO_SHA=$(git rev-parse origin/main-demo)

            echo "main:      $MAIN_SHA"
            echo "main-demo: $DEMO_SHA"

            # Create a backup of the original main-demo state.
            if [[ "$BACKUP_CREATED" == "false" ]]; then
              BACKUP_BRANCH="backup/main-demo-before-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

              git push origin \
                "${DEMO_SHA}:refs/heads/${BACKUP_BRANCH}"

              echo "Backup created: $BACKUP_BRANCH"
              BACKUP_CREATED=true
            fi

            # Start from the latest remote main-demo.
            git checkout -B main-demo "$DEMO_SHA"

            # Merge the latest main into main-demo.
            if ! git merge --no-edit "$MAIN_SHA"; then
              echo "::error::Merge conflict between main and main-demo."
              git merge --abort || true
              exit 1
            fi

            MERGED_SHA=$(git rev-parse HEAD)

            # Nothing to push if the branches are already aligned.
            if [[ "$MERGED_SHA" == "$DEMO_SHA" ]]; then
              echo "main is already included in main-demo."
              exit 0
            fi

            # Use a normal push. Never force-update main-demo.
            if git push origin HEAD:refs/heads/main-demo; then
              echo "Push succeeded."

              # Verify that main did not advance during synchronization.
              git fetch origin main main-demo

              LATEST_MAIN=$(git rev-parse origin/main)
              LATEST_DEMO=$(git rev-parse origin/main-demo)

              if git merge-base --is-ancestor "$LATEST_MAIN" "$LATEST_DEMO"; then
                echo "main is fully included in main-demo."
                echo "Synchronization completed successfully."
                exit 0
              fi

              echo "main advanced during synchronization. Retrying..."
              continue
            fi

            # If main-demo changed during the operation, fetch it
            # and retry using its newest state.
            git fetch origin main-demo

            LATEST_DEMO=$(git rev-parse origin/main-demo)

            if [[ "$LATEST_DEMO" != "$DEMO_SHA" ]]; then
              echo "main-demo changed during synchronization."
              echo "The new commit was preserved. Retrying..."
              continue
            fi

            echo "::error::Push failed, but main-demo did not change."
            echo "::error::Check GitHub App permissions and branch rulesets."
            exit 1
          done

          echo "::error::Synchronization did not finish after $MAX_ATTEMPTS attempts."
          echo "::error::No force-push was performed. All remote commits remain intact."
          exit 1

