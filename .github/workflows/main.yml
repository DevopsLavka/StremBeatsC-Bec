name: Merge Queue

on:
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  integration-tests:
    name: integration-tests
    runs-on: self-hosted

    steps:
      - name: Checkout merge group commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify tested SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA=$(git rev-parse HEAD)
          TREE_SHA=$(git rev-parse HEAD^{tree})

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          echo "Tree SHA:     $TREE_SHA"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out commit does not match the merge group SHA."
            exit 1
          fi

          echo "Verified: tests will run on the exact merge group commit."

      - name: Run integration tests
        env:
          ENV_FILE: /home/vboxuser/StremBeatsC-Bec/.env
        run: ./test.sh
